# 開発用：docker compose up で MySQL と Rails を起動する
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password   # 開発用のみ（本番では使わない）
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  mysql_data:
  bundle:
