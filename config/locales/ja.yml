# 日本語の表示（画面の項目名とエラーメッセージ）
ja:
  activerecord:
    models:
      user: ユーザー
      phase: 大窓
      window: 小窓
      plan: 課題
      entry: 記録
      diary: 轍
      diary_plan: 行動予定
    attributes:
      user:
        name: 名前
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
      phase:
        code: 記号
        name: 大窓の名前
      window:
        number: 番号
        title: 小窓の題名
        measure: 数え方
        target_count: 全体の数
      plan:
        title: 課題
        done_at: 済んだ日時
      entry:
        recorded_on: 記録した日
        attempted_count: やった数
        achieved_count: できた数
        title: 題名
        body: 本文
      diary:
        diary_on: 日付
        word: 今日の一言
        must_do: 今日必ずやること
        diary_plans: 行動予定
        redo_1: やり直せるなら（1）
        redo_2: やり直せるなら（2）
        redo_3: やり直せるなら（3）
        redo_4: やり直せるなら（4）
        redo_5: やり直せるなら（5）
        joy: 今日嬉しかったこと
        growth: 成長したこと、上達したこと
        thanks: 「ありがとう！」と言った、言われたこと
      diary/diary_plans:
        starts_at: 行動予定の始まり
        ends_at: 行動予定の終わり
        window: 行動予定の小窓
        memo: 行動予定のひと言
        as_planned: 予定どおり
        actual_starts_at: 実際の始まり
        actual_ends_at: 実際の終わり
      diary_plan:
        starts_at: 始まり
        ends_at: 終わり
        window: 小窓
        memo: ひと言
    enums:
      window:
        measure:
          plan_count: 課題型（済んだ課題 ÷ 課題）
          achievement_rate: 達成率型（できた数 ÷ やった数）
    errors:
      models:
        user:
          attributes:
            email:
              # 登録済みかどうかを他人に知らせないよう、遠回しな文言にする（MVPレビュー #83）
              taken: は使用できません
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: を入力してください
      taken: はすでに使われています
      invalid: の形式が正しくありません
      confirmation: と%{attribute}の入力が一致しません
      too_long: は%{count}文字以内で入力してください
      too_short: は%{count}文字以上で入力してください
      inclusion: は一覧にありません
      required: を選んでください
      not_a_number: は数字で入力してください
      not_an_integer: は整数で入力してください
      greater_than: は%{count}より大きい値にしてください
  helpers:
    submit:
      create: 登録する
