# 日本語の表示（画面の項目名とエラーメッセージ）
ja:
  activerecord:
    models:
      user: ユーザー
      phase: 大窓
      window: 小窓
      plan: 課題
    attributes:
      user:
        name: 名前
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
      phase:
        code: 記号
        name: 大窓の名前
      window:
        number: 番号
        title: 小窓の題名
        measure: 数え方
      plan:
        title: 課題
        done_at: 済んだ日時
    enums:
      window:
        measure:
          plan_count: 課題型（済んだ課題 ÷ 課題）
          achievement_rate: 達成率型（できた数 ÷ やった数）
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: を入力してください
      taken: はすでに使われています
      invalid: の形式が正しくありません
      confirmation: と%{attribute}の入力が一致しません
      too_long: は%{count}文字以内で入力してください
      too_short: は%{count}文字以上で入力してください
      inclusion: は一覧にありません
  helpers:
    submit:
      create: 登録する
